name: Create Release

on:
  push:
    tags:
      - "v*.*.*"
  repository_dispatch:
    types: [new-tag-created]

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --only-group dev

      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.client_payload.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Get changelog for this version
        id: changelog
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          echo "version=$TAG" >> "$GITHUB_ENV"
          echo "body<<EOF" >> "$GITHUB_ENV"
          # Extract changelog for this version from CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            BODY=$(uv run git-cliff --tag "$TAG" --strip all | tail -n +2 || true)
          else
            BODY=""
          fi
          echo "$BODY" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ env.version }}
          body: ${{ env.body }}
          draft: false
          prerelease: false
          make_latest: true
