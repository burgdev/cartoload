# Switzerland layer definitions and build targets

includes:
  - ../sources/swisstopo.yaml

# Default bounding box for all layers/targets in this file
bounds:
  west: 5.96
  east: 10.49
  south: 45.82
  north: 47.81

# Layer definitions: reusable data source + processing config (no output)
layers:
  # Basemaps
  ch_swisstopo_basemap:
    name: "Switzerland Basemap"
    description: "Swisstopo national map"
    type: raster
    format: wmts
    source:
      ref: swisstopo_wmts
      layer: ch.swisstopo.pixelkarte-farbe
    zoom_levels: [8, 9, 11, 12, 13, 14, 15, 16]

  ch_swisstopo_basemap_pk10:
    name: "Switzerland 1:10'000"
    description: "Swisstopo national map 1:10'000"
    type: raster
    format: wmts
    source:
      ref: swisstopo_wmts
      layer: ch.swisstopo.landeskarte-farbe-10
    zoom_levels: [16]

  ch_swisstopo_basemap_pk25:
    name: "Switzerland 1:25'000"
    description: "Swisstopo national map 1:25'000"
    type: raster
    format: wmts
    source:
      ref: swisstopo_wmts
      layer: ch.swisstopo.pixelkarte-farbe-pk25.noscale
    zoom_levels: [8, 9, 11, 12, 13, 14, 15, 16]

  ch_swisstopo_basemap_pk50:
    name: "Switzerland 1:50'000"
    description: "Swisstopo national map 1:50'000"
    type: raster
    format: wmts
    source:
      ref: swisstopo_wmts
      layer: ch.swisstopo.pixelkarte-farbe-pk50.noscale
    zoom_levels: [8, 9, 11, 12, 13, 14, 15, 16]

  ch_swisstopo_basemap_pk1000:
    name: "Switzerland 1:1 Million"
    description: "Swisstopo national map 1:1 Million"
    type: raster
    format: wmts
    source:
      ref: swisstopo_wmts
      layer: ch.swisstopo.pixelkarte-farbe-pk1000.noscale
    zoom_levels: [8, 9, 11]

  ch_swisstopo_hiking:
    name: "Switzerland Hiking Trails"
    description: "Swisstopo hiking trails"
    format: wmts
    source:
      ref: swisstopo_wmts
      layer: ch.swisstopo.swisstlm3d-wanderwege
      extension: png
    zoom_levels: [8, 9, 11, 12, 13, 14, 15, 16]

  ch_swisstopo_skitouring:
    name: "Switzerland Skiroutes"
    description: "Swisstopo skiroutes"
    format: wmts
    source:
      ref: swisstopo_wmts
      layer: ch.swisstopo-karto.skitouren
      extension: png
    zoom_levels: [8, 9, 11, 12, 13, 14, 15, 16]

  ch_swisstopo_skitouring_vector:
    name: "Switzerland Skiroutes (Vector)"
    description: "Swisstopo skiroutes rasterized from vector GeoPackage"
    format: gpkg
    source:
      ref: swisstopo_stac
      layer: ch.swisstopo-karto.skitouren
      asset_filter: {}
    style: ../styles/ski_network_2056.qml
    zoom_levels: [11, 12, 13, 14, 15, 16]

  ch_swisstopo_steepness:
    name: "Switzerland steepness"
    description: "Terrain steepness shading overlay"
    type: raster_overlay
    format: wmts
    source:
      ref: swisstopo_wmts
      layer: ch.swisstopo.hangneigung-ueber_30
      extension: png
    zoom_levels: [15, 16]

  ch_swisstopo_stac_pk25:
    name: "Switzerland STAC PK25"
    description: "swisstopo national map via STAC, 1:25000"
    type: raster
    format: geotiff
    source:
      ref: swisstopo_stac
      layer: ch.swisstopo.pixelkarte-farbe-pk25.noscale
    zoom_levels: [8, 9, 11, 12, 13, 14, 15, 16]

# Build targets: what to produce (with output files)
targets:
  ch_swisstopo_winter_outdoor:
    name: "Switzerland Winter Outdoor"
    description: "Swisstopo national map with skitouring and hiking overlays"
    output: ch_swisstopo_ski_hiking.img
    zoom_levels: [8, 9, 11, 12, 13, 14, 15, 16]
    layers:
      - ref: ch_swisstopo_basemap_pk1000
        zoom_levels: [9]
      - ref: ch_swisstopo_basemap
        zoom_levels: [8, 11, 12, 13, 14, 15, 16]
      - ref: ch_swisstopo_hiking
        opacity:
          { 11: 0.4, 12: 0.4, 13: 0.4, 14: 0.6, 15: 0.7, 16: 0.7, 17: 0.5 }
        zoom_levels: [13, 14, 15, 16]
      - ref: ch_swisstopo_skitouring
        opacity:
          { 11: 0.4, 12: 0.4, 13: 0.5, 14: 0.6, 15: 0.6, 16: 0.6, 17: 0.5 }
        zoom_levels: [13, 14, 15, 16]
      - ref: ch_swisstopo_steepness
        opacity: { 15: 0.2, 16: 0.3, 17: 0.2 }
        zoom_levels: [15, 16]
        extension: png

  ch_swisstopo_basemap:
    output: ch_swisstopo_basemap.img
    zoom_levels: [8, 9, 11, 12, 13, 14, 15, 16]
    layers:
      - ref: ch_swisstopo_basemap

  ch_swisstopo_hiking:
    output: ch_swisstopo_hiking.img
    zoom_levels: [8, 9, 11, 12, 13, 14, 15, 16]
    layers:
      - ref: ch_swisstopo_hiking

  ch_swisstopo_skitouring:
    output: ch_swisstopo_skitouring.img
    zoom_levels: [8, 9, 11, 12, 13, 14, 15, 16]
    layers:
      - ref: ch_swisstopo_skitouring

  ch_swisstopo_steepness:
    output: ch_swisstopo_steepness.img
    zoom_levels: [15, 16]
    layers:
      - ref: ch_swisstopo_steepness
