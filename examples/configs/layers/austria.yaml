# Austria layer definitions and build targets

includes:
  - ../sources/basemap_at.yaml

bounds:
  west: 9.53
  east: 17.16
  south: 46.37
  north: 49.02

layers:
  at_basemap:
    name: "Austria basemap"
    description: "basemap.at standard basemap"
    type: raster
    format: wmts
    source: basemap_at_wmts
    source_args:
      layer: geolandbasemap
    zoom_levels: [10, 12, 14]

targets:
  at_basemap:
    name: "Austria basemap"
    output: at_basemap.img
    layers:
      - ref: at_basemap
