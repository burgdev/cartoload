# Switzerland composite layer example
# Demonstrates combining basemap + overlay layers into a single IMG file.
#
# Usage:
#   cartoload build \
#     -S examples/configs/sources/swisstopo.yaml \
#     -L examples/configs/layers/switzerland_composite.yaml \
#     -l ch_ski_hikes

bounds:
  west: 5.96
  east: 10.49
  south: 45.82
  north: 47.81

layers:
  # Basemap layer (also usable standalone)
  ch_basemap:
    name: "Switzerland 1:25k"
    description: "swisstopo national map, colour, 1:25000"
    source:
      ref: swisstopo_wmts
      layer: ch.swisstopo.pixelkarte-farbe
    zoom_levels: [8, 9, 11, 12, 13, 14, 15, 17]
    exporter: garmin_img
    output: ch_basemap.img

  ch_hiking:
    name: "Hiking Switzerland"
    description: "swisstopo national map, colour, 1:25000"
    source:
      ref: swisstopo_wmts
      layer: ch.swisstopo.swisstlm3d-wanderwege
      extension: png
    zoom_levels: [8, 9, 11, 12, 13, 14, 15, 17]
    exporter: garmin_img
    output: ch_hiking.img

  # Composite: basemap + ski routes
  # The layers list is ordered bottom-to-top. The first entry is the base.
  ch_ski_hikes:
    name: "Switzerland Ski and Hikes 1:25k"
    description: "swisstopo national map with ski and hiking routes"
    zoom_levels: [8, 9, 11, 12, 13, 14, 15, 17]
    exporter: garmin_img
    output: ch_ski_hikes.img
    layers:
      - ref: ch_basemap
      - name: "Skiroutes Switzerland"
        source:
          ref: swisstopo_wmts
          layer: ch.swisstopo-karto.skitouren
          extension: png
        zoom_levels: [9, 11, 12, 13, 14, 15]
        opacity: 0.6
      - ref: ch_hiking
        opacity: { 12: 0.3, 14: 0.8 }
        zoom_levels: [8, 9, 11]

  # Composite using dict-style source on an inline sub-layer
  ch_basemap_overlay:
    name: "Switzerland basemap with steepness overlay"
    description: "Basemap + steepness using dict-style source args"
    zoom_levels: [8, 9, 11, 12, 13, 14]
    exporter: garmin_img
    output: ch_basemap_overlay.img
    layers:
      - ref: ch_basemap
      - name: "Steepness"
        source:
          ref: swisstopo_wmts
          layer: ch.swisstopo-ov.hangneigungskarte
          extension: png
        zoom_levels: [9, 11, 12, 13, 14]
        opacity: 0.5
