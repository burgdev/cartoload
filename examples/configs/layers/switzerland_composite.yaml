# Switzerland composite layer example
# Demonstrates combining basemap + overlay layers into a single IMG file.
#
# Usage:
#   cartoload build -c examples/configs/layers/switzerland_composite.yaml -l ch_ski_hikes

includes:
  - ../sources/swisstopo.yaml

bounds:
  west: 5.96
  east: 10.49
  south: 45.82
  north: 47.81

layers:
  # Basemap layer (also usable standalone via target)
  ch_basemap:
    name: "Switzerland 1:25k"
    description: "swisstopo national map, colour, 1:25000"
    format: wmts
    source: swisstopo_wmts
    source_args:
      layer: ch.swisstopo.pixelkarte-farbe
    zoom_levels: [8, 9, 11, 12, 13, 14, 15, 17]

  ch_hiking:
    name: "Hiking Switzerland"
    description: "swisstopo hiking routes overlay"
    format: wmts
    source: swisstopo_wmts
    source_args:
      layer: ch.swisstopo.swisstlm3d-wanderwege
      extension: png
    zoom_levels: [8, 9, 11, 12, 13, 14, 15, 17]

  ch_skiroutes:
    name: "Skiroutes Switzerland"
    description: "swisstopo ski routes overlay"
    format: wmts
    source: swisstopo_wmts
    source_args:
      layer: ch.swisstopo-karto.skitouren
      extension: png
    zoom_levels: [9, 11, 12, 13, 14, 15]

  ch_steepness:
    name: "Steepness"
    description: "swisstopo steepness overlay"
    format: wmts
    source: swisstopo_wmts
    source_args:
      layer: ch.swisstopo-ov.hangneigungskarte
      extension: png
    zoom_levels: [9, 11, 12, 13, 14]

targets:
  # Single-layer target: basemap only
  ch_basemap:
    name: "Switzerland 1:25k"
    output: ch_basemap.img
    layers:
      - ref: ch_basemap

  # Single-layer target: hiking only
  ch_hiking:
    name: "Hiking Switzerland"
    output: ch_hiking.img
    layers:
      - ref: ch_hiking

  # Composite target: basemap + ski routes
  ch_ski_hikes:
    name: "Switzerland Ski and Hikes 1:25k"
    description: "swisstopo national map with ski and hiking routes"
    output: ch_ski_hikes.img
    layers:
      - ref: ch_basemap
      - ref: ch_skiroutes
        zoom_levels: [9, 11, 12, 13, 14, 15]
        opacity: 0.6
      - ref: ch_hiking
        opacity: { 12: 0.3, 14: 0.8 }
        zoom_levels: [8, 9, 11]

  # Composite target: basemap + steepness overlay
  ch_basemap_overlay:
    name: "Switzerland basemap with steepness overlay"
    description: "Basemap + steepness overlay"
    output: ch_basemap_overlay.img
    layers:
      - ref: ch_basemap
      - ref: ch_steepness
        opacity: 0.5
