# France layer definitions and build targets

includes:
  - ../sources/france_ign.yaml

bounds:
  west: -5.15
  east: 9.56
  south: 41.33
  north: 51.09

layers:
  fr_basemap:
    name: "France basemap"
    description: "IGN Géoportail standard basemap"
    type: raster
    format: wmts
    source: ign_wmts
    source_args:
      layer: GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2
    zoom_levels: [10, 12, 14]

targets:
  fr_basemap:
    name: "France basemap"
    output: fr_basemap.img
    layers:
      - ref: fr_basemap
