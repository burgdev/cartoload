# Switzerland layer definitions and build targets

includes:
  - switzerland.yaml

# Default bounding box for all layers/targets in this file
bounds:
  west: 5.96
  east: 10.49
  south: 45.82
  north: 47.81

layers:
  ch_stac_pk25:
    name: "Switzerland STAC PK25"
    description: "swisstopo national map via STAC, 1:25000"
    type: raster
    format: geotiff
    source:
      ref: swisstopo_stac
      layer: ch.swisstopo.pixelkarte-farbe-pk25.noscale
    zoom_levels: [8, 9, 11, 12, 13, 14, 15, 16]

targets:
  ch_wmts:
    name: "Switzerland WMTS Test"
    description: "swisstopo national map, colour, 1:25000"
    output: ch_wmts_test.img
    zoom_levels: [8, 9, 11, 12, 13, 14, 15]
    layers:
      - ref: ch_swisstopo_basemap

  ch_stac_pk25:
    name: "Switzerland STAC Test"
    description: "swisstopo national map, colour, 1:25000"
    output: ch_stac_pk25.img
    zoom_levels: [8, 9, 11, 12, 13, 14, 15, 16]
    layers:
      - ref: ch_stac_pk25

  ch_stac:
    name: "Switzerland STAC Composite"
    description: "swisstopo national map, colour, multi-scale composite"
    output: ch_stac_test.img
    zoom_levels: [8, 9, 11, 12, 13, 14, 15, 16, 17]
    layers: # first entry is bottom
      - name: "Switzerland 1:10000"
        format: geotiff
        zoom_levels: [17]
        source:
          ref: swisstopo_stac
          layer: ch.swisstopo.landeskarte-farbe-10
          asset_filter:
            geoadmin:variant: krel
      - name: "Switzerland 1:25000"
        format: geotiff
        zoom_levels: [15, 16]
        source:
          ref: swisstopo_stac
          layer: ch.swisstopo.pixelkarte-farbe-pk25.noscale
      - name: "Switzerland 1:50000"
        format: geotiff
        zoom_levels: [13, 14]
        source:
          ref: swisstopo_stac
          layer: ch.swisstopo.pixelkarte-farbe-pk50.noscale
      - name: "Switzerland 1:200000"
        format: geotiff
        zoom_levels: [12]
        source:
          ref: swisstopo_stac
          layer: ch.swisstopo.pixelkarte-farbe-pk200.noscale
      - name: "Switzerland 1:1 Million"
        format: geotiff
        zoom_levels: [8, 9, 11]
        source:
          ref: swisstopo_stac
          layer: ch.swisstopo.pixelkarte-farbe-pk1000.noscale
      - ref: ch_swisstopo_hiking
        opacity:
          { 11: 0.4, 12: 0.4, 13: 0.4, 14: 0.6, 15: 0.7, 16: 0.7, 17: 0.5 }
        zoom_levels: [13, 14, 15, 16, 17]
      - ref: ch_swisstopo_skitouring_vector
        opacity:
          { 11: 0.4, 12: 0.4, 13: 0.5, 14: 0.6, 15: 0.7, 16: 0.7, 17: 0.5 }
        zoom_levels: [13, 14, 15, 16, 17]
      - ref: ch_swisstopo_steepness
        opacity: { 15: 0.2, 16: 0.3, 17: 0.2 }
        zoom_levels: [15, 16, 17]
        extension: png

  ch_basemap_25k:
    output: ch_basemap_25k.img
    zoom_levels: [8, 9, 11, 12, 13, 14, 15, 16]
    layers:
      - ref: ch_swisstopo_basemap

  ch_basemap_10k:
    output: ch_basemap_10k.img
    zoom_levels: [12, 14, 15, 16]
    layers:
      - ref: ch_swisstopo_basemap

  ch_hiking:
    output: ch_hiking.img
    zoom_levels: [8, 9, 11, 12, 13, 14, 15, 16]
    layers:
      - ref: ch_swisstopo_hiking

  ch_steepness:
    output: ch_steepness.img
    zoom_levels: [12, 14]
    layers:
      - ref: ch_swisstopo_steepness
