# swisstopo source definitions
# https://wmts.geo.admin.ch/1.0.0/WMTSCapabilities.xml

sources:
  swisstopo_wmts:
    type: wmts
    # ${layer} and ${extension} are config-level variables resolved from
    # defaults or layer source_args at pipeline time.
    # ${x}, ${y}, ${z} are per-tile variables resolved at download time.
    defaults:
      layer: ch.swisstopo.pixelkarte-farbe
      extension: jpeg
    urls:
      - "https://wmts0.geo.admin.ch/1.0.0/${layer}/default/current/3857/${z}/${x}/${y}.${extension:-jpeg}"
      - "https://wmts1.geo.admin.ch/1.0.0/${layer}/default/current/3857/${z}/${x}/${y}.${extension:-jpeg}"
      - "https://wmts2.geo.admin.ch/1.0.0/${layer}/default/current/3857/${z}/${x}/${y}.${extension:-jpeg}"
      - "https://wmts3.geo.admin.ch/1.0.0/${layer}/default/current/3857/${z}/${x}/${y}.${extension:-jpeg}"
      - "https://wmts4.geo.admin.ch/1.0.0/${layer}/default/current/3857/${z}/${x}/${y}.${extension:-jpeg}"
      - "https://wmts5.geo.admin.ch/1.0.0/${layer}/default/current/3857/${z}/${x}/${y}.${extension:-jpeg}"
      - "https://wmts6.geo.admin.ch/1.0.0/${layer}/default/current/3857/${z}/${x}/${y}.${extension:-jpeg}"
      - "https://wmts7.geo.admin.ch/1.0.0/${layer}/default/current/3857/${z}/${x}/${y}.${extension:-jpeg}"
      - "https://wmts8.geo.admin.ch/1.0.0/${layer}/default/current/3857/${z}/${x}/${y}.${extension:-jpeg}"
      - "https://wmts9.geo.admin.ch/1.0.0/${layer}/default/current/3857/${z}/${x}/${y}.${extension:-jpeg}"
    attribution: "© swisstopo"
    rate_limit_ms: 150
    max_threads: 4

  swisstopo_stac:
    type: stac
    defaults:
      layer: ch.swisstopo.pixelkarte-farbe-pk25.noscale
      asset_filter:
        geoadmin:variant: komb
    urls:
      - "https://data.geo.admin.ch/api/stac/v1/collections/${layer}"
    attribution: "© swisstopo"

  # GeoTIFF source: point at a directory of already-downloaded GeoTIFF files
  # (e.g. cache from a previous stac download)
  swisstopo_geotiff:
    type: path
    urls:
      - ".cartoload_cache/swisstopo_stac/ch.swisstopo.pixelkarte-farbe-pk25.noscale/"
    attribution: "© swisstopo"
